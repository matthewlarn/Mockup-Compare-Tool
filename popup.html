
<!DOCTYPE html>
<html>
<head>
  <title>Enhanced Design Version Comparator</title>
  <style>
    body { width: 300px; padding: 10px; font-family: Arial, sans-serif; }
    input, button, textarea { margin: 5px 0; width: 100%; }
    #pasteArea { height: 50px; }
    #instructions { font-size: 12px; margin-top: 10px; }
    .slider-container { display: flex; align-items: center; }
    .slider-container input { flex-grow: 1; margin-left: 10px; }
    .value-label { min-width: 40px; text-align: right; }
    #disclaimer { 
      font-size: 10px; 
      color: #666; 
      margin-top: 15px; 
      border-top: 1px solid #ccc; 
      padding-top: 10px; 
    }
    #disclaimer a { color: #0066cc; text-decoration: none; }
    #disclaimer a:hover { text-decoration: underline; }
    #arrowControls {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 10px;
    }
    .arrow-button {
      padding: 5px 10px;
      font-size: 18px;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }
    .arrow-button:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h2>Design Version Comparator</h2>
  <input type="file" id="imageUpload" accept="image/png,image/jpeg,image/gif">
  <textarea id="pasteArea" placeholder="Paste image here"></textarea>
  <button id="applyOverlay">Apply Overlay</button>
  <button id="removeOverlay">Remove Overlay</button>
  <div class="slider-container">
    <label for="opacitySlider">Opacity:</label>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="0.5">
    <span id="opacityValue" class="value-label">50%</span>
  </div>
  <div class="slider-container">
    <label for="scaleSlider">Scale:</label>
    <input type="range" id="scaleSlider" min="0.1" max="2" step="0.1" value="1">
    <span id="scaleValue" class="value-label">100%</span>
  </div>
   <div id="arrowControls">
    <button class="arrow-button" id="moveLeft">&larr;</button>
    <button class="arrow-button" id="moveUp">&uarr;</button>
    <button class="arrow-button" id="moveDown">&darr;</button>
    <button class="arrow-button" id="moveRight">&rarr;</button>
  </div>
  <div id="instructions">
    Use arrow keys or buttons to move the overlay.
    Shift + arrow keys for larger movements.
    Click and drag to move the overlay with the mouse.
  </div>
  <div id="disclaimer">
    This extension was collaboratively designed by an AI assistant and <a href="https://www.matthewstephens.com" target="_blank">Matthew Stephens</a>.
  </div>
  <script src="popup.js"></script>
</body>
</html>
